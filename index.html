<!DOCTYPE html>
<html lang="en" data-mode="day" data-pal="horizon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161D2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="vowway">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="icon" type="image/png" href="icon-192.png?v=3">
<title>vowway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one phone-width column floating over a living landscape (mountain lake, open sea or desert dunes) that follows the time of day; frosted dark-glass cards and light text; lamp amber is the only accent */
  --surface:rgba(14,20,36,.36); --solid:#161D2C; --field:rgba(255,255,255,.09);
  --ink:#F5F2EC; --muted:rgba(245,242,236,.74); --line:rgba(255,255,255,.16);
  --lamp:#F4C47E; --lamp-glow:#F2B95E; --lamp-soft:rgba(242,185,94,.24);
  --sage:#A9D6C0; --rose:#F2A49B; --dusk:#BAC0F2;
  --display:'Newsreader', Georgia, serif;
  --body:'Instrument Sans', system-ui, -apple-system, sans-serif;
  --mark:'Cormorant Garamond', Georgia, serif;
  --r:22px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior-y:none}
html{background:#0E1424}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;z-index:-2;transition:opacity 1s}
#scene svg{width:100%;height:100%;display:block}
#scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,22,.28) 0%,rgba(6,10,22,.06) 28%,rgba(6,10,22,.42) 62%,rgba(6,10,22,.72) 100%)}
#scene .orb{transition:opacity .25s linear}
.lede,.greet h1{text-shadow:0 1px 14px rgba(6,10,22,.45)}
/* keeps content from sliding under the clock and battery */
.topfade{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);z-index:19;background:color-mix(in srgb,var(--solid) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:none}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.greet h1,.greet .date,.greet .lede,.ob h1,.ob .lede,.mark{text-shadow:0 1px 14px rgba(0,0,0,.35)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lamp-glow);outline-offset:2px;border-radius:8px}
.app{max-width:440px;margin:0 auto;min-height:100%;padding:env(safe-area-inset-top) 18px 110px}
.app.ob-mode{padding-bottom:24px;display:flex;flex-direction:column}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 4px}
.mark{font-family:var(--mark);font-size:29px;font-weight:600;letter-spacing:.05em;line-height:1}
.mark i{color:var(--lamp-glow);font-style:normal}
.top-r{display:flex;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.iconbtn svg{width:18px;height:18px}

/* type */
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.2;letter-spacing:-.01em}
h2{font-size:21px;line-height:1.3}
h3{font-size:17px;line-height:1.35}
.date{color:var(--muted);font-size:13px;margin:0 0 2px}
.eyebrow{font-size:11.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:0;font-weight:500}
.eyebrow.go{color:var(--lamp)}
.lede{color:var(--muted);margin:6px 0 0;font-size:14.5px}
.small{font-size:13px;color:var(--muted);margin:0}
.small a{color:var(--lamp)}
.stack{display:flex;flex-direction:column;gap:14px}
.greet{padding:34px 0 10px}
.greet h1{font-size:34px}

/* cards */
.card{background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.card.quiet{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border-style:dashed}
.card.now{box-shadow:inset 0 0 0 1px var(--lamp-glow),0 10px 30px -18px var(--lamp-glow)}
.ff{animation:ffl 3.2s ease-in-out infinite}
.ffnew{animation:ffin 1.8s cubic-bezier(.2,.8,.2,1),ffl 3.2s 1.8s ease-in-out infinite}
.flying .ff{animation:flyup 2.6s ease-in forwards}
@keyframes ffl{50%{opacity:.55}}
.ffw{animation:wander 9s ease-in-out infinite}
@keyframes wander{0%,100%{transform:translate(0,0)}25%{transform:translate(var(--x1),var(--y1))}50%{transform:translate(var(--x2),var(--y2))}75%{transform:translate(var(--x3),var(--y3))}}
@keyframes ffin{from{transform:translateY(-46px);opacity:0}}
@keyframes flyup{to{transform:translate(var(--dx,0),-120px);opacity:0}}
@media (prefers-reduced-motion: reduce){.ff,.ffnew,.ffw{animation:none}}
.flybox{display:grid;place-items:center}.flybox .lampsvg{width:170px;height:170px;overflow:visible}
.lsizes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lsizes button{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.lsizes button b{font-weight:500;color:var(--ink);font-size:12.5px}
.lsizes button[aria-pressed=true]{border-color:var(--lamp-glow);background:var(--surface)}
.lsizes button:disabled{opacity:.4}
.lsizes .lampsvg{width:44px;height:44px}
.youcard ul{margin:8px 0 10px;padding:0;list-style:none}
.youcard li{position:relative;padding:5px 0 5px 20px;font-size:15px;line-height:1.45}
.youcard li::before{content:"";position:absolute;left:2px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--lamp-glow);box-shadow:0 0 8px var(--lamp-glow)}
.trybox{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--field);border:1px solid var(--line);font-size:14.5px;line-height:1.45}
.trybox span{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--lamp);margin-bottom:3px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row3 .btn{padding:10px 4px;font-size:14px}
.lampcard{flex-direction:row;align-items:center;gap:10px;padding:10px 18px}
.lampsvg{width:84px;height:84px;flex:none}
.big{font-family:var(--display);font-size:32px;margin:0;line-height:1.05;font-variant-numeric:tabular-nums}
.big span{font-size:14px;color:var(--muted);font-family:var(--body)}
.flame-in{transform-origin:60px 60px;animation:flicker 3.4s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(.96,1.04) rotate(-1.5deg)}60%{transform:scale(1.03,.97) rotate(1deg)}}
.next-stone{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-top:4px}
.next-stone b{width:8px;height:8px;border-radius:2px;border:1px solid var(--muted);transform:rotate(45deg);opacity:.6}
.wisdom q{font-family:var(--display);font-size:20px;line-height:1.45;quotes:none;display:block}
.wisdom .foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.station-q{font-family:var(--display);font-style:italic;font-size:19px;line-height:1.45;margin:0}

/* today rows */
.rowi{display:flex;align-items:center;gap:12px;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.rowi:first-of-type{border-top:0;padding-top:2px}
.rowi .ic{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:var(--solid)}
.rowi .ic svg{width:13px;height:13px}
.rowi.done .ic{background:var(--sage);border-color:var(--sage)}
.rowi .rt{flex:1;min-width:0}
.rowi .rt b{font-weight:500;display:block;font-size:14.5px}
.rowi .rt span{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi.done .rt b{color:var(--muted)}
.rowi .chev{color:var(--muted);font-size:18px;line-height:1}

/* one sky */
.sky{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin:0 -4px}
.sky::-webkit-scrollbar{display:none}
.city{flex:none;width:62px;text-align:center;padding:8px 2px;border-radius:14px}
.city.me{background:var(--field)}
.city .orb{width:22px;height:22px;border-radius:50%;margin:0 auto 6px}
.orb.dawn{background:linear-gradient(180deg,#F2C48C,#E99A7F)}
.orb.day{background:radial-gradient(circle at 40% 40%,#FBE7A6,#EDC15F)}
.orb.dusk{background:linear-gradient(180deg,#D98A7B,#8F78A8)}
.orb.night{background:radial-gradient(circle at 35% 35%,#55597E,#262A45);box-shadow:inset -4px -3px 0 0 rgba(255,255,255,.15)}
.city .ct{font-size:12.5px;font-variant-numeric:tabular-nums}
.city .cn{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* controls */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.center{justify-content:center}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 13px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--solid);border-color:var(--ink)}
.chip:disabled{opacity:.5}
.row{display:flex;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;min-width:0}
textarea{resize:none;min-height:64px;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
.btn{border-radius:14px;padding:10px 16px;font-size:14px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--solid)}
.btn.glow{background:var(--lamp-glow);color:#24190A}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.wide{width:100%;padding:13px}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:0;color:var(--lamp);font-size:13px;font-weight:500;text-align:left}
.done-line{display:flex;align-items:center;gap:12px}
.tick{width:28px;height:28px;border-radius:50%;background:var(--sage);color:var(--solid);display:grid;place-items:center;flex:none}
.tick svg{width:15px;height:15px}
.intent-word{font-family:var(--display);font-size:28px;color:var(--lamp);font-style:italic}
details.roots{font-size:12.5px;color:var(--muted)}
details.roots summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px}
details.roots summary::-webkit-details-marker{display:none}
details.roots summary::before{content:"+";display:inline-grid;place-items:center;width:16px;height:16px;border:1px solid var(--line);border-radius:50%;font-size:11px;line-height:1}
details.roots[open] summary::before{content:"–"}
details.roots p{margin:8px 0 0;padding-left:10px;border-left:2px solid var(--lamp-soft)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.toggle input{accent-color:var(--lamp-glow);width:16px;height:16px}

/* steps & stations */
.stepno{display:flex;gap:5px}
.stepno span{height:3px;flex:1;border-radius:3px;background:var(--line)}
.stepno span.on{background:var(--lamp-glow)}
.stone{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;position:relative;padding-bottom:16px}
.stone:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:2px;width:1.5px;background:var(--line)}
.stone .mk{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);background:var(--solid);position:relative;z-index:1}
.stone.done .mk{background:var(--sage);border-color:var(--sage);color:var(--solid)}
.stone.done .mk svg{width:14px;height:14px}
.stone.now .mk{border-color:var(--lamp-glow);color:var(--lamp);box-shadow:0 0 0 4px var(--lamp-soft)}
.stone.later{opacity:.55}
.stone h3{font-family:var(--body);font-size:14.5px;font-weight:500}
.ring{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-size:12.5px;background:var(--field);color:var(--muted)}
.st.past{color:var(--ink)}
.st.past::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--sage);margin:5px auto 0}
.st.now{border-color:var(--lamp-glow);color:var(--ink);background:var(--lamp-soft);font-weight:500}
.miles{display:flex;justify-content:space-between;align-items:center;position:relative;padding:6px 4px}
.miles::before{content:"";position:absolute;left:14px;right:14px;top:16px;height:1.5px;background:var(--line)}
.mile{position:relative;z-index:1;text-align:center;font-size:12px;color:var(--muted)}
.mile b{display:block;width:12px;height:12px;margin:4px auto 6px;transform:rotate(45deg);border-radius:3px;border:1.5px solid var(--line);background:var(--solid)}
.mile.on b{background:var(--lamp-glow);border-color:var(--lamp-glow)}
.mile.on{color:var(--ink)}

/* practice */
.ptop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dayno{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line)}
.dot.done{background:var(--lamp-glow);border-color:var(--lamp-glow)}
.dot.missed{border-style:dashed}
.dot.today{border-color:var(--ink)}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pfoot .small{flex:1;min-width:0}
.pfoot .btn,.pfoot .link,.pfoot .row{flex:none}
.pfoot .row{align-items:center;gap:14px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lamp-glow);border-radius:6px}
.dot.slip{border-color:var(--rose);opacity:.8}
.vform{display:flex;flex-direction:column;gap:12px}
.vform .opt-label{margin:0}
.libitem{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.libitem:first-child{border-top:0;padding-top:0}
.libitem h3{font-family:var(--body);font-size:14px;font-weight:500}
.together{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:0}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--sage);animation:pulse 2.4s ease-in-out infinite;flex:none}
@keyframes pulse{50%{opacity:.3}}
.demo{font-size:10.5px;border:1px solid var(--line);border-radius:6px;padding:0 5px}
.lit{display:flex;flex-wrap:wrap;gap:6px}
.lit span{font-size:12.5px;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;display:inline-flex;align-items:center;gap:6px}
.lit span::before{content:"";width:6px;height:9px;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;background:var(--lamp-glow)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin-top:10px}

/* silence */
.breath-wrap{position:relative;height:250px;display:grid;place-items:center}
.breath{position:absolute;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,var(--lamp-soft) 0%,transparent 70%);transform:scale(.62)}
.breath::after{content:"";position:absolute;inset:36px;border-radius:50%;border:1px solid var(--muted);opacity:.45}
.breath.on{animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%{transform:scale(.62)}40%{transform:scale(1)}100%{transform:scale(.62)}}
.breath-center{position:relative;text-align:center}
.breath-label{font-family:var(--display);font-size:19px;font-style:italic;max-width:118px;line-height:1.2;margin:0 auto}
.time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--field)}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{background:none;border:0;padding:9px 4px;font-size:13.5px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--solid)}
.seg button:disabled{opacity:.6}
.opt-label{font-size:12px;color:var(--muted);margin:0 0 6px}
.sleep-screen{position:fixed;inset:0;z-index:35;background:#07090F;color:#C9C6D6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;animation:fade 1.2s}
.sleep-screen .t{font-family:var(--display);font-size:54px;font-variant-numeric:tabular-nums;opacity:.65}
.sleep-screen p{max-width:280px;opacity:.55;margin:0;font-size:14px}
.sleep-screen button{background:none;border:1px solid rgba(255,255,255,.18);color:#C9C6D6;border-radius:999px;padding:10px 22px;margin-top:20px}

/* journal */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week .wd{font-size:11.5px;color:var(--muted)}
.week .wdot{width:26px;height:26px;border-radius:50%;margin:4px auto 0;border:1.5px dashed var(--line)}
.week .wdot.on{border-style:solid;border-color:var(--lamp-glow);background:var(--lamp-soft)}
.week .wdot.today{outline:1.5px solid var(--ink);outline-offset:2px}
.entry{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.entry:first-of-type{border-top:0;padding-top:0}
.ehead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mood{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.mood b{width:9px;height:9px;border-radius:50%;display:inline-block}
.qa{margin:0;font-size:14px}
.qa span{display:block;font-size:12px;color:var(--muted)}
.del{background:none;border:0;color:var(--muted);font-size:12.5px;padding:4px}
.del.confirm{color:var(--rose);font-weight:500}
.ex{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px}
.privacy{flex-direction:row;gap:10px;align-items:flex-start}
.privacy svg{width:18px;height:18px;flex:none;color:var(--sage);margin-top:2px}
.letter{font-family:var(--display);font-size:18px;line-height:1.6}
.letter p{margin:0 0 12px}
.letter .sig{font-style:italic;color:var(--muted)}

/* onboarding */
.ob{flex:1;display:flex;flex-direction:column;gap:22px;padding-top:22px}
.ob h1{font-size:34px}
.ob .grow{flex:1}
.ob-hero{display:grid;place-items:center;padding:24px 0 8px}
.ob-hero .lampsvg{width:150px;height:150px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:13px 16px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--lamp-glow)}
.opt[aria-pressed="true"]::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--lamp-glow);flex:none}
.ob-foot{display:flex;flex-direction:column;gap:10px}
.ob-back{background:none;border:0;color:var(--muted);font-size:13.5px;padding:6px;align-self:center}

/* library */
.lib-item{display:flex;align-items:center;gap:12px;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.lib-item:first-of-type{border-top:0;padding-top:2px}
.lib-ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.lib-ic svg{width:18px;height:18px}

.globe .flag{bottom:auto;animation:rise 5.5s ease-out forwards;transform:translate(-50%,-100%)}

.flag{position:absolute;bottom:-24px;font-size:17px;line-height:1;opacity:0;filter:drop-shadow(0 0 6px rgba(242,185,94,.55));animation:drift 11s ease-in-out forwards}

.body{transition:opacity 1.4s, filter 1.4s, transform 1.4s}

/* storage: plain by default; with a passcode, the whole state is encrypted (PBKDF2 → AES-GCM) before it touches storage */
const TE = new TextEncoder(), TD = new TextDecoder();
const b64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function deriveKey(pin, salt){
  const base = await crypto.subtle.importKey('raw', TE.encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
let S, pinKey = null, pinSalt = null, lockedBlob = null, lockErr = '';
try { const raw = JSON.parse(localStorage.getItem(KEY));
  if (raw && raw.enc) { lockedBlob = raw; S = fresh(); } else S = raw ? Object.assign(fresh(), raw) : fresh(); } catch(e){ S = fresh(); }
function save(){
  if (lockedBlob) return;
  try {
    if (pinKey) { const iv = crypto.getRandomValues(new Uint8Array(12)), snapshot = JSON.stringify(S);
      crypto.subtle.encrypt({name:'AES-GCM', iv}, pinKey, TE.encode(snapshot)).then(ct => { try { localStorage.setItem(KEY, JSON.stringify({enc:1, salt:b64(pinSalt), iv:b64(iv), data:b64(ct)})); } catch(e){} }); }
    else localStorage.setItem(KEY, JSON.stringify(S));
  } catch(e){}
}
async function unlock(pin){
  try { const salt = unb64(lockedBlob.salt), key = await deriveKey(pin, salt);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(lockedBlob.iv)}, key, unb64(lockedBlob.data));
    S = Object.assign(fresh(), JSON.parse(TD.decode(pt))); pinKey = key; pinSalt = salt; lockedBlob = null; lockErr = '';
    render(); if (S.profile) openFlow(true);
  } catch(e){ lockErr = 'That passcode didn’t work. Try again.'; render(); }
}
async function setPin(pin){ pinSalt = crypto.getRandomValues(new Uint8Array(16)); pinKey = await deriveKey(pin, pinSalt); save(); }
function viewLock(){
  return `<div class="lockbox">${lanternSVG(4, 7, .8, 'lock')}<h1>Your journal is locked</h1><p class="lede">Enter your passcode to open it.</p>
    <input type="password" id="pin" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="Passcode">
    ${lockErr ? `<p class="err">${esc(lockErr)}</p>` : ''}
    <button class="btn glow wide" style="max-width:260px" data-act="unlock">Unlock</button>
    <button class="ob-back" data-act="forgotPin" style="${pendingDelete === 'pin' ? 'color:var(--rose)' : ''}">${pendingDelete === 'pin' ? 'Tap again: erase this journal and start over' : 'Forgot your passcode?'}</button></div>`;
}

function practiceCard(p){

  const n = Math.max(0, pDay(p)), todayDone = p.checks.includes(t), slipped = slips.includes(t);
  const label = !started ? `Starts ${fromKey(p.start).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'})}` : done ? 'Complete' : p.d ? `Day ${Math.min(n, p.d)} of ${p.d}` : `Day ${n}`;
  const tag = kind === 'quit' ? 'Giving something up' : pw ? `${pw} times a week` : 'Every day';
  let vis = '';
  if (p.d && p.d <= 31) vis = `<div class="dots" aria-label="${p.checks.length} of ${p.d} days">${Array.from({length:p.d}, (_,i) => { const k = add(p.start, i);
      return `<span class="dot ${p.checks.includes(k) ? 'done' : slips.includes(k) ? 'slip' : (k < t ? 'missed' : (k === t ? 'today' : ''))}" title="${shortDate(k)}"></span>`; }).join('')}</div>`;
  else if (started) { const pct = p.d ? Math.min(1, n / p.d) : ((n % 30) / 30);
    vis = `<div class="bar" aria-hidden="true"><i style="width:${(pct * 100).toFixed(1)}%"></i></div><p class="small">${p.checks.length} ${p.checks.length === 1 ? 'day' : 'days'} kept${slips.length ? ` · ${slips.length} ${slips.length === 1 ? 'slip' : 'slips'}, and still going` : ''}</p>`; }
  const status = !started ? 'Your vow begins soon.' : done ? `Kept ${p.checks.length} of ${p.d} days` : pw ? `This week: ${vowWeekCount(p)} of ${pw}` :
    kind === 'quit' ? (slipped ? 'A slip today. The vow goes on tomorrow.' : todayDone ? 'Kept today' : 'How did today go?') : (todayDone ? 'Kept today' : 'Not marked yet today');
  const nm = started && !done ? nextMilestone(p) : null;
  const btns = !started ? '' : done ? `<button class="link" data-act="removePractice" data-id="${p.id}">Remove</button>` :
    (todayDone || slipped) ? `<button class="btn ghost" disabled>${slipped ? 'Tomorrow' : 'Done'}</button>` :
    kind === 'quit' ? `<span class="row"><button class="link" data-act="slip" data-id="${p.id}" style="color:var(--muted)">I slipped</button><button class="btn glow" data-act="check" data-id="${p.id}">I kept it</button></span>` :
    `<button class="btn glow" data-act="check" data-id="${p.id}">I did it today</button>`;
  return `<div class="card">
    <div class="ptop"><div><h3>${esc(p.t)}</h3><p class="small">${tag}</p></div><span class="dayno">${label}</span></div>
    ${vis}
    ${nm ? `<p class="small">Next milestone: ${nm}</p>` : ''}
    ${p.r ? roots(p.r) : ''}
    <div class="pfoot"><span class="small">${status}</span>${btns}</div></div>`;
}

function todayYou(){

  const sm = S.silence.filter(x => x.date === t).reduce((a, x) => a + x.min, 0); if (sm) out.push(`You were still for ${plural(sm, 'minute')}.`);
  const kept = S.practices.filter(p => p.checks.includes(t)); if (kept.length) out.push(`You kept your promise: ${esc(kept[0].t.toLowerCase())}.`);

function weekLetter(){

  const walked = days.filter(k => A.has(k)).length;
  const sils = S.silence.filter(s => days.includes(s.date)), silMin = sils.reduce((a,s) => a + s.min, 0), silDays = new Set(sils.map(s => s.date));
  const refl = S.reflections.filter(r => days.includes(r.date) && r.mood), good = r => r.mood === 'calm' || r.mood === 'grateful';
  const words = [...new Set(days.map(k => S.intentions[k]).filter(Boolean))];
  const lamps = S.lamps.filter(l => days.includes(l.date)).length;
  const checks = S.practices.reduce((a,p) => a + p.checks.filter(c => days.includes(c)).length, 0);
  const lines = [];
  lines.push(walked === 0 ? 'This week was quiet. That’s all right. The path doesn’t go anywhere without you.' : `You walked the path on ${walked} of the last seven days.`);
  if (silMin) lines.push(`You spent ${plural(silMin,'minute')} in silence.`);
  const a = refl.filter(r => silDays.has(r.date)), b = refl.filter(r => !silDays.has(r.date));
  if (a.length && b.length && a.filter(good).length / a.length > b.filter(good).length / b.length) lines.push('On the days you sat in silence, your evenings felt calmer.');

  if (heavy >= 2) lines.push('Some evenings were heavy. You came back anyway, and that counts.');
  else if (refl.length >= 2 && refl.every(good)) lines.push('Every evening you wrote about felt calm or grateful.');
  if (words.length) lines.push(`Your words were ${words.join(', ').toLowerCase()}.`);
  if (checks) lines.push(`You kept your vows ${plural(checks,'time')}.`);
  if (lamps) lines.push(`You lit ${plural(lamps,'lamp')} for someone.`);
  const lv = days.map(k => (S.lived || {})[k]).filter(Boolean), tried = lv.filter(x => x.a !== 'no');
  if (lv.length) { lines.push(`You lived ${tried.length} of this week’s thoughts${tried.length && tried.length < lv.length ? ', and you were honest about the rest' : ''}.`);
    const best = lv.find(x => x.a === 'yes'); if (best) lines.push(`One that you tried: “${best.q}”`); }

  S.practices.filter(p => !pDone(p)).forEach(p => { const sl = (p.slips || []).filter(c => days.includes(c)).length, ok = p.checks.filter(c => days.includes(c)).length;
    if (sl >= 2) lines.push(`“${p.t}” slipped ${plural(sl,'time')}. That isn’t failure. Ask yourself what made those days harder, and make tomorrow a little easier.`);
    else if (ok >= 5) lines.push(`You kept “${p.t}” on ${ok} days. It is becoming part of you.`); });
  const tryNext = top.length ? top[0].next : heavy >= 2 ? 'three minutes of silence each morning' : walked >= 4 ? 'keep the same small rhythm; it is working' : 'one small step each day; that is enough';
  lines.push(`One thing to try next week: ${tryNext}.`);
  const s = station(); lines.push(s && !s.justFinished ? `Next week the path continues through ${s.st.n}.` : 'Next week, the path goes on.');

function startReading(it){
  reading = true; const b0 = document.getElementById('readbtn'); if (b0) b0.textContent = 'Loading…';
  const done = () => { reading = false; const x = document.getElementById('readbtn'); if (x) x.textContent = 'Listen'; };
  voPlay('read:' + it.id, done).then(ok => { if (!reading) { voStop(); return; } const x = document.getElementById('readbtn'); if (x) x.textContent = 'Stop'; if (!ok) readAloud(it.t + '. ' + it.text); });

function readAloud(text){
  if (!('speechSynthesis' in window)) { toast('Reading aloud isn’t available on this device'); return; }
  speechSynthesis.cancel();
  const parts = text.replace(/\n+/g, ' ').match(/[^.!?;]+[.!?;]*/g) || [text];
  parts.forEach((p, i) => { const u = new SpeechSynthesisUtterance(p.trim()); u.rate = .85; u.pitch = .95; if (VOICE) u.voice = VOICE;
    if (i === parts.length - 1) u.onend = () => { reading = false; const b = document.getElementById('readbtn'); if (b) b.textContent = 'Listen'; };
    speechSynthesis.speak(u); });
  reading = true;
}

/* ---------- guided flow ---------- */
let flow = null, flowIv = null;
function planFlow(){
  const j = journey(), d = today(), h = HOUR();
  if (h < 5) return {kind:'late', steps:[], cta:'Rest now', act:'sleepRain', sub:'It’s late. Let your thoughts settle.'};
  if (j.phase === 'first') {
    if (!j.avail) return {kind:'first', steps:[], cta:'Look around', sub:`Today’s step is taken. Tomorrow: ${j.step.t}.`};
    const map = {intent:['word','stone'], text:['grat','stone'], reflect:['mood','q0','keep','stone'], silence:['firststep'], practice:['firststep'], review:['firststep']};
    return {kind:'first', steps:map[j.step.type], cta:'Take today’s step', sub:`First steps · ${j.n} of 7: ${j.step.t}`};
  }
  if (isNight()) {
    if (!d.refl) return {kind:'evening', steps:[...((S.lived || {})[TODAY()] ? [] : ['lived']), 'mood','q0','q1','q2','keep','stone'], cta:'Close your day', sub:'Three short questions, then rest.'};
    return {kind:'evening', steps:[], cta:'Wind down for sleep', act:'sleep', sub:'Your day is closed.'};
  }
  const br = S.silence.some(x => x.date === TODAY()) ? [] : ['breath1'];
  return d.intent ? {kind:'morning', steps:[...br, 'carry','done'], cta:'Continue', sub:`Your word today: ${d.intent}`}
                  : {kind:'morning', steps:[...br, 'word','carry','stone'], cta:'Begin your day', sub:'One quiet minute, one word, one thing to try.'};
}
function openFlow(withArrival){
  const p = planFlow();
  if (!withArrival && !p.steps.length) { flowAct(p.act); return; }
  flow = Object.assign(p, {i: withArrival ? -1 : 0, data:{mood:null, a:['','','']}}); renderFlow();
}
let welcomeT = [], breathT = [];
function welcomeVoice(){
  welcomeT.forEach(clearTimeout); welcomeT = [];
  [[800,'You’re here. That’s already a good step.'],[6000,'Breathe in slowly, all the way down.'],[12000,'And let it go.'],[18000,'Nothing to fix. Nothing to achieve. Just this breath.']]
    .forEach(([ms, line]) => welcomeT.push(setTimeout(() => { if (flow && flow.welcome && flow.i === -1) speak(line); }, ms)));
  welcomeT.push(setTimeout(() => { const g = document.querySelector('.welcome-go'); if (g) g.classList.add('shown'); }, 22000));
}
function welcomeStop(){ welcomeT.forEach(clearTimeout); welcomeT = []; breathT.forEach(clearTimeout); breathT = []; voStop(); }
function closeFlow(){ welcomeStop(); flow = null; renderFlow(); render(); }
function flowAct(act){
  if (act === 'sleep') { setSil('sleep', 20, 'ocean'); sil.voice = true; go('silence'); }
  else if (act === 'sleepRain') { setSil('sleep', 20, 'rain'); sil.voice = true; go('silence'); }
  else closeFlow();
}

/* night sky: a few slow stars in evening light */
(function stars(){
  const cv = document.getElementById('stars'), x = cv.getContext('2d'); let pts = [], gold = [], flies = [];
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){ const r = window.devicePixelRatio || 1; cv.width = innerWidth * r; cv.height = innerHeight * r;
    pts = Array.from({length:70}, () => ({x:Math.random(), y:Math.random()*.75, r:(Math.random()*1.1 + .3) * r, p:Math.random()*6.28})); }
  function draw(ts){ x.clearRect(0,0,cv.width,cv.height);
    const nf = Math.min((typeof S !== 'undefined' && S.freed) || 0, 160);
    if (gold.length !== nf) { const r = window.devicePixelRatio || 1; let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      gold = Array.from({length:nf}, () => ({x:rnd(), y:rnd()*.6, r:(rnd()*.9 + .9) * r, p:rnd()*6.28})); }
    if (document.documentElement.dataset.phase === 'night') gold.forEach(s => { const a = .45 + .45*(still ? .6 : (Math.sin(ts/1300 + s.p) + 1)/2);
      x.fillStyle = `rgba(255,214,140,${a.toFixed(2)})`; x.beginPath(); x.arc(s.x*cv.width, s.y*cv.height, s.r, 0, 6.283); x.fill(); });
    const ph = document.documentElement.dataset.phase;
    if ((ph === 'night' || ph === 'dusk') && typeof S !== 'undefined' && S.scene === 'meadow') {
      if (!flies.length) { let sd = 11; const rn = () => (sd = (sd * 16807) % 2147483647) / 2147483647; flies = Array.from({length:24}, () => ({x:rn(), y:.62 + rn() * .34, a:rn() * 6.28, b:rn() * 6.28, s:.4 + rn() * .6})); }
      const r = window.devicePixelRatio || 1, t = still ? 0 : ts / 1000;
      flies.forEach(f => { const fx = (f.x + .025 * Math.sin(t * .23 * f.s + f.a)) * cv.width, fy = (f.y + .018 * Math.sin(t * .31 * f.s + f.b)) * cv.height;
        const on = Math.max(0, Math.sin(t * .9 * f.s + f.a * 3)); if (on < .05) return;
        const gr = x.createRadialGradient(fx, fy, 0, fx, fy, 9 * r); gr.addColorStop(0, `rgba(255,214,120,${(.55 * on).toFixed(2)})`); gr.addColorStop(1, 'rgba(255,214,120,0)');
        x.fillStyle = gr; x.beginPath(); x.arc(fx, fy, 9 * r, 0, 6.283); x.fill();
        x.fillStyle = `rgba(255,248,220,${(.9 * on).toFixed(2)})`; x.beginPath(); x.arc(fx, fy, 1.4 * r, 0, 6.283); x.fill(); });
    }
    if (document.documentElement.dataset.phase === 'night') pts.forEach(s => { const a = .2 + .4*(still ? .6 : (Math.sin(ts/1700 + s.p) + 1)/2);
      x.fillStyle = `rgba(255,248,232,${a.toFixed(2)})`; x.beginPath(); x.arc(s.x*cv.width, s.y*cv.height, s.r, 0, 6.283); x.fill(); });
    if (!still) requestAnimationFrame(draw); }
  size(); addEventListener('resize', size); requestAnimationFrame(draw); if (still) setInterval(() => draw(0), 1500);
})();

    const dayAmt = Math.max(0, Math.min(1, (day + .08) / .22));        // soft dusk band instead of a hard line
    if (dayAmt > 0) { x.fillStyle = `rgba(214,232,248,${(.22 + .62 * Math.min(1, day * 1.4 + .2)) * dayAmt * edge})`; x.beginPath(); x.arc(px, py, .95 * sz, 0, 6.283); x.fill(); }
    if (dayAmt < 1) { const night = 1 - dayAmt;
      if (LAND_LIT[i]) { const tw = .6 + .4 * Math.sin(ts / 1100 + i * 1.7);
        x.fillStyle = `rgba(255,170,80,${.18 * night * edge})`; x.beginPath(); x.arc(px, py, 2.6 * sz, 0, 6.283); x.fill();
        x.fillStyle = `rgba(255,212,150,${(.55 + .4 * tw) * night * edge})`; x.beginPath(); x.arc(px, py, .8 * sz, 0, 6.283); x.fill(); }
      else { x.fillStyle = `rgba(120,145,195,${.42 * night * edge})`; x.beginPath(); x.arc(px, py, .75 * sz, 0, 6.283); x.fill(); }
    }
  }
  // gentle pings where someone just began
  G.pings = G.pings.filter(p => ts - p.t < 3200);
  G.pings.forEach(p => { const [px, py, c] = proj(p.lat, p.lon); if (c <= 0) return; const k = (ts - p.t) / 3200;
    x.strokeStyle = `rgba(242,185,94,${.7 * (1 - k)})`; x.lineWidth = 1.2; x.beginPath(); x.arc(px, py, 3 + k * 14, 0, 6.283); x.stroke();
    x.fillStyle = `rgba(255,214,150,${1 - k * .6})`; x.beginPath(); x.arc(px, py, 2.4, 0, 6.283); x.fill(); });
  // a new flag every few seconds, from a place facing us
  if (ts > G.nextFlag && !stillMotion) {
    G.nextFlag = ts + 800 + Math.random() * 700;
    const vis = PLACES.filter(([, la, lo]) => proj(la * Math.PI / 180, lo * Math.PI / 180)[2] > .3);
    if (vis.length && document.querySelectorAll('#globe .flag').length < 8) { const [f, la, lo] = vis[Math.floor(Math.random() * vis.length)], lat = la * Math.PI / 180, lon = lo * Math.PI / 180, [px, py] = proj(lat, lon);
      G.pings.push({lat, lon, t: ts});
      const wrap = document.getElementById('globe'), e = document.createElement('span'); e.className = 'flag'; e.textContent = f;
      e.style.left = px + 'px'; e.style.top = (py - 6) + 'px'; e.addEventListener('animationend', () => e.remove()); wrap.appendChild(e); }
  }
}
requestAnimationFrame(drawGlobe);

try { if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai|claudeusercontent/.test(location.host)) navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(r => r.update()).catch(() => {}); } catch(e){}
